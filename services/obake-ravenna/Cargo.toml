[package]
name = "obake-ravenna"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
description = "RAVENNA session daemon for the obake PipeWire graph"
license = "MIT"
publish = false

[[bin]]
name = "obake-ravenna"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
bytes = "1"
log = "0.4"
env_logger = "0.11"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pipewire = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
