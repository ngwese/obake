#
# Stand-in PipeWire drop-in mirroring what `obake-ravenna` creates via its
# PipeWire client (`system-pipewire` feature on the image). Keep this file
# OFF the board when the daemon is managing the graph, or you get duplicates.
#
# Install for manual board bring-up only:
#   cp 99-ravenna-test.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire wireplumber
#
# Matches examples/config.toml: 48 kHz, 48 frames/packet, group
# obake.ravenna, multicast 239.1.60.50:5004, 8ch L24, payload 104
# (96 + channels). clock.interface must match ptp4l.cfg.

# ---------------------------------------------------------------------------
# PTP media clock (daemon: ensure once for the ptp4l interface)
# ---------------------------------------------------------------------------
context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = "obake-ptp-driver"
            node.group      = "obake.ravenna"
            priority.driver = 100000
            clock.name      = "clock.system.ptp1"
            clock.interface = "enp3s0"
            resync.ms       = 1.5
            # Do not set object.export (registers a twin Node).
        }
    }
    # Manual test tone (not owned by obake-ravenna). Link to obake-out-1.
    { factory = adapter
        args = {
            factory.name     = audiotestsrc
            node.name        = "tone"
            node.description = "tone"
            node.group       = "obake.ravenna"
            media.class      = "Audio/Source"
            audio.rate       = 48000
            audio.channels   = 2
            node.param.Props = {
                live = true
            }
        }
    }
]

# ---------------------------------------------------------------------------
# Stream modules (daemon: one block per up source/sink)
# ---------------------------------------------------------------------------
context.modules = [
    { name = libpipewire-module-rtp-sink
        args = {
            local.ifname     = "enp3s0"
            destination.ip   = "239.1.60.50"
            destination.port = 5004
            # 8ch L24 * 48 samples = 1152 payload — fits MTU 1500.
            net.mtu          = 1500
            net.ttl          = 15
            net.loop         = false

            sess.min-ptime     = 1
            sess.max-ptime     = 1
            sess.latency.msec  = 3
            sess.name          = "obake-out-1"
            sess.media         = "audio"
            sess.ts-refclk     = "ptp=traceable"
            sess.ts-offset     = 0
            sess.ts-direct     = false

            audio.format   = "S24BE"
            audio.rate     = 48000
            audio.channels = 8

            # Drive RTP from the PTP driver via node.group only.
            # Do NOT set aes67.driver-group on this PipeWire.

            stream.props = {
                node.name           = "obake-out-1"
                media.class         = "Audio/Sink"
                node.virtual        = true
                device.api          = "aes67"
                node.always-process = true
                node.group          = "obake.ravenna"
                node.autoconnect    = false
                # Must be in stream.props — module does not copy top-level.
                rtp.framecount      = 48
                rtp.payload         = 104
                rtp.ntp             = 0
                rtp.fetch-ts-refclk = true
            }
        }
    }
]
