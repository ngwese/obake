#
# Typical obake-ravenna configuration (example only).
# Copy and edit under ~/.config/obake-ravenna/config.toml.
# The image seed starts with no [[source]] / [[sink]] entries.

[graph]
rate = 48000
node_group = "obake.ravenna"

# Continuous FOLLOWER dwell before sources/sinks come up (ms). Default 2000;
# set 0 for immediate bring-up on lock.
# [ptp]
# lock_hold_ms = 2000

# RTP frames per packet (not the PipeWire quantum).
[packet]
frames = 48

[multicast]
address = "239.1.60.50"
base_port = 5004
ttl = 15

[[source]]
name = "obake-out-1"
channels = 8
format = "L24"
# payload defaults to 96 + channels (104 for 8ch)
# address = "239.1.60.51"   # optional pin
# port = 5010               # optional even pin

[[sink]]
name = "obake-in-1"
device = "Anubis"
stream = "Anubis_Combo 1/2"
